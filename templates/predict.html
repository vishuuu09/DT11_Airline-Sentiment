<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Sentiment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            resize: none;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 1.1rem;
            background: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #e84118;
        }

        .result {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff6b81;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentiment Analysis</h1>
        <p>Enter a message to analyze its sentiment.</p>
        <form action="/predict" method="POST">
            <textarea name="message" rows="5" placeholder="Type your message here..."></textarea>
            <button class="btn" type="submit">Analyze Sentiment</button>
        </form>

        {% if sentiment %}
            <div class="result">
                <p>Sentiment: {{ sentiment }}</p>
            </div>
        {% endif %}
    </div>

    <div class="footer">
        <p>&copy; 2025 Airline Sentiment. All Rights Reserved.</p>
    </div>
</body>
</html>
