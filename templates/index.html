<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Airline Sentiment Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://via.placeholder.com/1920x1080') center/cover no-repeat; /* Placeholder image */
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark overlay */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(18, 62, 88, 0.7); /* Dark background for content */
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease-in-out;
            width: 80%;
            max-width: 600px;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            background-color: #ff6f61;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #ff3b2d;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1rem;
            color: #fff;
            opacity: 0.8;
        }

    </style>
</head>
<body>
    <div class="overlay">
        <div class="container">
            <h1>Airline Sentiment Analysis</h1>
            <p>Welcome to our platform where we analyze customer feedback to help airlines improve their services and enhance the flying experience.</p>
            <button class="btn" onclick="window.location.href='/predict'">Get Started</button>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Airline Sentiment. All Rights Reserved.</p>
    </div>
</body>
</html>
